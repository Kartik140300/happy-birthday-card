<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎁 You have a surprise!</title>
  <style>
    /* ── Reset & Base ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(120deg, #ffe4ef, #ffd9ee, #f1e0ff, #ffe8dc, #ffe4ef);
      background-size: 300% 300%;
      animation: bgShift 18s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* soft glow behind the card */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 105, 180, 0.28), transparent 45%);
    }

    /* ── Floating hearts background ── */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart-particle {
      position: absolute;
      bottom: -60px;
      font-size: 1.4rem;
      opacity: 0;
      animation: floatHeart linear infinite;
    }

    @keyframes floatHeart {
      0% { transform: translateY(0) scale(0.8) rotate(-10deg); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-110vh) scale(1.2) rotate(10deg); opacity: 0; }
    }

    /* Confetti canvas for the gift burst */
    #burst {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 998;
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255, 182, 210, 0.55);
      border-radius: 28px;
      padding: 48px 44px 40px;
      max-width: 520px;
      width: 90vw;
      text-align: center;
      box-shadow:
        0 8px 32px rgba(255, 105, 160, 0.18),
        0 2px 8px rgba(255, 105, 160, 0.10);
      animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes popIn {
      from { transform: scale(0.7) translateY(40px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* NEW: card fades away after the gift opens */
    .card.leaving {
      animation: leave 0.55s ease-in forwards;
      pointer-events: none;
    }

    @keyframes leave {
      from { transform: scale(1) translateY(0); opacity: 1; }
      to { transform: scale(0.9) translateY(-24px); opacity: 0; }
    }

    /* ── Gift (SVG so the lid can pop off) ── */
    .gift-wrap {
      width: 160px;
      height: 160px;
      margin: 0 auto 28px;
      border-radius: 22px;
      box-shadow: 0 6px 24px rgba(255, 105, 160, 0.28);
      animation: float 3.2s ease-in-out infinite, hop 4.5s ease-in-out infinite;
      background: linear-gradient(135deg, #ffd6e7 0%, #ffb3d1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .gift-svg {
      width: 120px;
      height: 120px;
      overflow: visible;
    }

    .gift-glow {
      opacity: 0;
      transition: opacity 0.3s;
    }

    .lid {
      transform-box: fill-box;
      transform-origin: center;
    }

    /* Step 1: the box shakes */
    .gift-wrap.opening .gift-svg {
      animation: giftShake 0.6s ease-in-out;
    }

    /* Step 2: the lid pops off and light spills out */
    .gift-wrap.opened .gift-glow {
      opacity: 1;
    }

    .gift-wrap.opened .lid {
      animation: lidPop 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    }

    @keyframes giftShake {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(-8deg); }
      30% { transform: rotate(8deg); }
      45% { transform: rotate(-10deg); }
      60% { transform: rotate(10deg); }
      75% { transform: rotate(-5deg); }
    }

    @keyframes lidPop {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate(26px, -150px) rotate(40deg); opacity: 0; }
    }

    @keyframes float {
      0%, 100% { translate: 0 0; rotate: -1deg; }
      50% { translate: 0 -10px; rotate: 1deg; }
    }

    @keyframes hop {
      0%, 70%, 100% { scale: 1; }
      78% { scale: 1.12 0.92; }
      86% { scale: 0.95 1.08; }
      93% { scale: 1.04; }
    }

    /* ── Typography ── */
    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #d63384;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 8px rgba(214, 51, 132, 0.15);
    }

    .subtitle {
      font-size: 1rem;
      color: #a05070;
      margin-bottom: 8px;
      min-height: 1.5em;
    }

    .question {
      font-size: 1.05rem;
      font-weight: 700;
      color: #c2185b;
      margin-bottom: 32px;
    }

    .emoji-big {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 18px;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 36px;
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.2px;
      width: 190px;
      white-space: nowrap;
    }

    .btn-placeholder {
      width: 190px;
      height: 50px;
      flex-shrink: 0;
      display: none;
    }

    .btn-yes {
      width: 240px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #ff4da6 0%, #ff85c2 100%);
      color: #fff;
      box-shadow: 0 4px 18px rgba(255, 77, 166, 0.45);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 18px rgba(255, 77, 166, 0.45); }
      50% { box-shadow: 0 4px 30px rgba(255, 77, 166, 0.8), 0 0 0 8px rgba(255, 77, 166, 0.12); }
    }

    .btn-yes:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 8px 28px rgba(255, 77, 166, 0.55);
    }

    .btn-yes:active {
      transform: scale(0.97);
    }

    .btn-yes:disabled {
      cursor: default;
      animation: none;
      transform: none;
    }

    .btn-no {
      background: rgba(255, 200, 220, 0.7);
      color: #c2185b;
      box-shadow: 0 2px 10px rgba(255, 105, 160, 0.15);
      position: relative;
      transition: none;
    }

    .btn-no.escaping {
      position: fixed;
      z-index: 5;
    }

    /* ── Sparkle burst ── */
    .sparkle {
      position: fixed;
      pointer-events: none;
      font-size: 1.6rem;
      z-index: 999;
      animation: sparkleOut 0.9s ease-out forwards;
    }

    @keyframes sparkleOut {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.5) translateY(-60px); opacity: 0; }
    }

    /* ── Hint text ── */
    .hint {
      margin-top: 22px;
      min-height: 1.2em;
      font-size: 0.9rem;
      font-weight: 600;
      color: #c2185b;
      letter-spacing: 0.3px;
    }

    /* ── Screen 2: 4-digit passcode ── */
    .pin-row {
      display: flex;
      gap: 14px;
      justify-content: center;
    }

    .pin-box {
      width: 58px;
      height: 66px;
      border: 2px solid #ffb3d1;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.8);
      text-align: center;
      font: inherit;
      font-size: 1.7rem;
      font-weight: 800;
      color: #c2185b;
      caret-color: #ff4da6;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }

    .pin-box:focus {
      border-color: #ff4da6;
      box-shadow: 0 0 0 5px rgba(255, 77, 166, 0.14);
      transform: translateY(-2px);
    }

    .pin-box:disabled {
      background: #fff0f6;
      border-color: #ff85c2;
      opacity: 1;
    }

    .shake {
      animation: shake 0.45s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(7px); }
    }

    @media (prefers-reduced-motion: reduce) {

      body,
      .gift-wrap,
      .btn-yes,
      .heart-particle,
      .gift-wrap.opening .gift-svg {
        animation: none;
      }

      .heart-particle {
        opacity: 0.4;
      }

      .gift-wrap.opened .lid {
        animation: none;
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- Floating hearts background -->
  <div class="hearts-bg" id="heartsBg"></div>
  <canvas id="burst" aria-hidden="true"></canvas>

  <!-- ═════════ SCREEN 1: the gift ═════════ -->
  <div class="card" id="screen1">
    <div class="gift-wrap" id="giftBox" aria-label="A gift box">
      <svg class="gift-svg" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fffbe0" stop-opacity="1" />
            <stop offset="60%" stop-color="#ffe27a" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#ffe27a" stop-opacity="0" />
          </radialGradient>
        </defs>
        <!-- light spilling out of the box -->
        <circle class="gift-glow" cx="50" cy="44" r="46" fill="url(#glow)" />
        <!-- box -->
        <rect x="20" y="50" width="60" height="38" rx="5" fill="#FFC857" />
        <rect x="45" y="50" width="10" height="38" fill="#E0357F" />
        <!-- lid + bow (this part flies off) -->
        <g class="lid">
          <rect x="14" y="36" width="72" height="16" rx="5" fill="#FFD166" />
          <rect x="45" y="36" width="10" height="16" fill="#E0357F" />
          <ellipse cx="39" cy="30" rx="11" ry="7" transform="rotate(-20 39 30)" fill="#E0357F" />
          <ellipse cx="61" cy="30" rx="11" ry="7" transform="rotate(20 61 30)" fill="#E0357F" />
          <circle cx="50" cy="33" r="5" fill="#C2185B" />
        </g>
      </svg>
    </div>

    <h1 id="title">Hey, Birthday Girl! 🎀</h1>
    <p class="subtitle" id="subtitle"></p>
    <p class="question">Do you want to open your surprise? 👀</p>

    <div class="btn-row">
      <button class="btn btn-yes" id="btnYes" onclick="onYes()">Yes! Open it 💝</button>
      <button class="btn btn-no" id="btnNo">No</button>
      <div class="btn-placeholder" id="noPlaceholder"></div>
    </div>

    <p class="hint" id="hint"></p>
  </div>

  <!-- ═════════ SCREEN 2: the fun gate ═════════ -->
  <div class="card" id="screen2" hidden>
    <div class="emoji-big">🔐</div>
    <h1>Quick security check</h1>
    <p class="subtitle" style="margin-bottom: 26px;">Enter the secret 4-digit code to unlock your surprise…</p>
    <div class="pin-row" id="pinWrap">
      <input class="pin-box" type="password" inputmode="numeric" autocomplete="off" aria-label="Digit 1" />
      <input class="pin-box" type="password" inputmode="numeric" autocomplete="off" aria-label="Digit 2" />
      <input class="pin-box" type="password" inputmode="numeric" autocomplete="off" aria-label="Digit 3" />
      <input class="pin-box" type="password" inputmode="numeric" autocomplete="off" aria-label="Digit 4" />
    </div>
    <p class="hint" id="pinMsg" aria-live="polite"></p>
  </div>

  <!-- ═════════ SCREEN 3: placeholder for the next screen ═════════ -->
  <div class="card" id="screen3" hidden>
    <div class="emoji-big">🎈</div>
    <h1>Next screen goes here</h1>
    <p class="subtitle">The compliment balloons are coming next…</p>
  </div>

  <script>
    /* ═══════════════════════════════════
       0. EDIT ME
    ═══════════════════════════════════ */
    const HER_NAME = "Birthday Girl";  // her name, e.g. "Riya"
    const NEXT_PAGE = "";              // optional: a file to open after the passcode, e.g. "compliments.html"
    const PASSCODE = "1430";           // the secret 4-digit code — e.g. her birthday as MMDD, like "0724"
    const PASSCODE_HINT = "it's a very special date 🎂";          // optional hint under the boxes, e.g. "Hint: it's a very special date 🎂"

    document.getElementById('title').textContent = 'Hey, ' + HER_NAME + '! 🎀';
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const $ = (id) => document.getElementById(id);


    /* ═══════════════════════════════════
       1. Floating hearts background
    ═══════════════════════════════════ */
    const HEARTS = ['🩷', '💕', '💖', '💗', '✨', '🌸', '🎀', '💞', '⭐', '🎈'];
    const bg = $('heartsBg');

    function spawnHeart() {
      const el = document.createElement('span');
      el.className = 'heart-particle';
      el.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (0.8 + Math.random() * 1.3) + 'rem';
      if (Math.random() > 0.65) el.style.filter = 'blur(2px)';
      const dur = 6 + Math.random() * 8;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = (Math.random() * -dur) + 's';
      bg.appendChild(el);
      setTimeout(() => el.remove(), (dur + 1) * 1000);
    }

    for (let i = 0; i < 26; i++) spawnHeart();
    setInterval(spawnHeart, 700);


    /* ═══════════════════════════════════
       2. Typing effect for the subtitle
    ═══════════════════════════════════ */
    const subtitleEl = $('subtitle');
    const subtitleText = 'Someone made something special just for you…';

    if (reduceMotion) {
      subtitleEl.textContent = subtitleText;
    } else {
      let ti = 0;
      setTimeout(function type() {
        subtitleEl.textContent = subtitleText.slice(0, ++ti);
        if (ti < subtitleText.length) setTimeout(type, 45);
      }, 800);
    }


    /* ═══════════════════════════════════
       3. "No" button runs away 🐒
    ═══════════════════════════════════ */
    const btnNo = $('btnNo');
    const noPlaceholder = $('noPlaceholder');
    const hint = $('hint');
    let noEscapes = 0;
    let isEscaping = false;

    const NO_TEXTS = [
      'Are you sure? 🥺',
      'Really? 😢',
      'Pretty please? 🥹',
      "Don't do this to me 😭",
      'Okay fine… 😤'
    ];
    const MAX_ESCAPES = 8;

    function getRandomPos() {
      const bw = btnNo.offsetWidth || 190;
      const bh = btnNo.offsetHeight || 50;
      const margin = 16;
      const maxX = window.innerWidth - bw - margin;
      const maxY = window.innerHeight - bh - margin;
      return {
        x: margin + Math.random() * Math.max(0, maxX - margin),
        y: margin + Math.random() * Math.max(0, maxY - margin),
      };
    }

    function runAway() {
      if (!isEscaping) {
        const rect = btnNo.getBoundingClientRect();
        btnNo.style.left = rect.left + 'px';
        btnNo.style.top = rect.top + 'px';
        btnNo.classList.add('escaping');
        noPlaceholder.style.display = 'block';
        isEscaping = true;
      }

      noEscapes++;

      if (noEscapes >= MAX_ESCAPES) {
        btnNo.style.transition = 'opacity 0.4s';
        btnNo.style.opacity = '0';
        btnNo.style.pointerEvents = 'none';
        noPlaceholder.style.display = 'none';
        hint.textContent = "Nice try — you don't get to say no 😄";
        setTimeout(() => btnNo.remove(), 450);
        return;
      }

      btnNo.textContent = NO_TEXTS[Math.min(noEscapes - 1, NO_TEXTS.length - 1)];
      btnNo.style.width = 'auto';

      if (noEscapes >= 3) {
        btnNo.style.fontSize = Math.max(0.7, 1.05 - (noEscapes - 2) * 0.06) + 'rem';
        btnNo.style.padding = '10px 18px';
      }

      const pos = getRandomPos();
      btnNo.style.left = pos.x + 'px';
      btnNo.style.top = pos.y + 'px';

      btnNo.animate([
        { transform: 'rotate(0deg) scale(1)' },
        { transform: `rotate(${(Math.random() > 0.5 ? 1 : -1) * (30 + Math.random() * 60)}deg) scale(0.85)` },
        { transform: 'rotate(0deg) scale(1)' },
      ], { duration: 350, easing: 'ease-out' });
    }

    btnNo.addEventListener('click', runAway);
    btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); runAway(); }, { passive: false });


    /* ═══════════════════════════════════
       4. Confetti burst + screen switching
    ═══════════════════════════════════ */
    function burst(cx, cy, count) {
      if (reduceMotion) return;
      const c = $('burst'), ctx = c.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const W = window.innerWidth, H = window.innerHeight;
      c.width = W * dpr; c.height = H * dpr;
      const colors = ['#ff4da6', '#ff85c2', '#ffd166', '#ffffff', '#c9a7ff', '#8fe3c7'];
      const ps = Array.from({ length: count || 130 }, () => {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1; // mostly upward
        const sp = 5 + Math.random() * 10;
        return {
          x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
          r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
          c: colors[Math.floor(Math.random() * colors.length)]
        };
      });
      const start = performance.now();
      (function frame(t) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        let alive = 0;
        ps.forEach((p) => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.28; p.vx *= 0.99; p.r += p.vr;
          if (p.y < H + 20) alive++;
          ctx.save();
          ctx.translate(p.x, p.y); ctx.rotate(p.r);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        if (alive && t - start < 4000) requestAnimationFrame(frame);
        else ctx.clearRect(0, 0, W, H);
      })(start);
    }

    function sparkles(cx, cy) {
      const emojis = ['🎉', '✨', '🩷', '💖', '🎀', '🌸', '💕', '🎊'];
      emojis.forEach((em, i) => {
        const s = document.createElement('span');
        s.className = 'sparkle';
        s.textContent = em;
        const angle = (i / emojis.length) * 360;
        const dist = 60 + Math.random() * 60;
        s.style.left = (cx + Math.cos(angle * Math.PI / 180) * dist) + 'px';
        s.style.top = (cy + Math.sin(angle * Math.PI / 180) * dist) + 'px';
        s.style.animationDelay = (i * 0.04) + 's';
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1200);
      });
    }

    // Fade one card out, then fade the next one in
    function switchScreen(from, to) {
      from.classList.add('leaving');
      setTimeout(() => {
        from.hidden = true;
        to.hidden = false;
        if (to.id === 'screen2' && typeof pinBoxes !== 'undefined') pinBoxes[0].focus();
      }, reduceMotion ? 0 : 550);
    }


    /* ═══════════════════════════════════
       5. "Yes" — the gift opens 🎁
    ═══════════════════════════════════ */
    function onYes() {
      const yes = $('btnYes');
      if (yes.disabled) return;
      yes.disabled = true;
      btnNo.style.pointerEvents = 'none';

      const gift = $('giftBox');
      gift.classList.add('opening');                 // 1) the box shakes

      setTimeout(() => {                             // 2) lid pops, confetti bursts
        gift.classList.add('opened');
        const r = gift.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        burst(cx, cy - 20, 140);
        sparkles(cx, cy);
      }, reduceMotion ? 0 : 650);

      setTimeout(() => {                             // 3) card fades, next screen appears
        btnNo.style.display = 'none';
        switchScreen($('screen1'), $('screen2'));
      }, reduceMotion ? 600 : 2100);
    }


    /* ═══════════════════════════════════
       6. Screen 2 — 4-digit passcode gate
    ═══════════════════════════════════ */
    const pinBoxes = Array.from(document.querySelectorAll('.pin-box'));
    const pinWrap = $('pinWrap');
    const pinMsg = $('pinMsg');
    if (PASSCODE_HINT) pinMsg.textContent = PASSCODE_HINT;

    pinBoxes.forEach((box, i) => {
      box.addEventListener('input', () => {
        box.value = box.value.replace(/\D/g, '').slice(-1);
        if (box.value && i < pinBoxes.length - 1) pinBoxes[i + 1].focus();
        if (pinBoxes.every((b) => b.value)) checkPin();
      });

      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && i > 0) pinBoxes[i - 1].focus();
      });

      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, pinBoxes.length);
        digits.split('').forEach((d, j) => { if (pinBoxes[j]) pinBoxes[j].value = d; });
        if (digits.length === pinBoxes.length) checkPin();
        else pinBoxes[Math.min(digits.length, pinBoxes.length - 1)].focus();
      });
    });

    function checkPin() {
      const entered = pinBoxes.map((b) => b.value).join('');
      if (entered === PASSCODE) {
        pinBoxes.forEach((b) => (b.disabled = true));
        pinMsg.textContent = 'Verifying… 🔍';
        setTimeout(() => {
          pinMsg.textContent = "✅ It's really you!";
          const r = pinWrap.getBoundingClientRect();
          burst(r.left + r.width / 2, r.top, 70);
        }, 1200);
        setTimeout(goNext, 2400);
      } else {
        pinMsg.textContent = 'Wrong code, try again 😅';
        pinWrap.classList.remove('shake');
        void pinWrap.offsetWidth; // restart the animation
        pinWrap.classList.add('shake');
        pinBoxes.forEach((b) => (b.value = ''));
        pinBoxes[0].focus();
      }
    }

    function goNext() {
      if (NEXT_PAGE) {
        window.location.href = NEXT_PAGE;
      } else {
        switchScreen($('screen2'), $('screen3'));
      }
    }
  </script>
</body>

</html>
