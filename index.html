<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎀 Happy Birthday!</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #ffe4ef;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* ── Floating hearts background ── */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .heart-particle {
      position: absolute;
      bottom: -60px;
      font-size: 1.4rem;
      opacity: 0;
      animation: floatHeart linear infinite;
    }
    @keyframes floatHeart {
      0%   { transform: translateY(0) scale(0.8) rotate(-10deg); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-110vh) scale(1.2) rotate(10deg); opacity: 0; }
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255, 182, 210, 0.55);
      border-radius: 28px;
      padding: 48px 44px 40px;
      max-width: 520px;
      width: 90vw;
      text-align: center;
      box-shadow:
        0 8px 32px rgba(255, 105, 160, 0.18),
        0 2px 8px rgba(255, 105, 160, 0.10);
      animation: popIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes popIn {
      from { transform: scale(0.7) translateY(40px); opacity: 0; }
      to   { transform: scale(1)   translateY(0);    opacity: 1; }
    }

    /* ── Gift image ── */
    .gift-wrap {
      width: 160px;
      height: 160px;
      margin: 0 auto 28px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(255, 105, 160, 0.28);
      animation: float 3.2s ease-in-out infinite;
      background: linear-gradient(135deg, #ffd6e7 0%, #ffb3d1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5.5rem;
      line-height: 1;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50%       { transform: translateY(-10px) rotate(1deg); }
    }

    /* ── Typography ── */
    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #d63384;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 8px rgba(214, 51, 132, 0.15);
    }
    .subtitle {
      font-size: 1rem;
      color: #a05070;
      margin-bottom: 8px;
    }
    .question {
      font-size: 1.05rem;
      font-weight: 700;
      color: #c2185b;
      margin-bottom: 32px;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 36px;
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.2px;
      width: 190px;        /* fixed width — never stretches */
    }

    /* Invisible placeholder keeps Yes button at same width when No escapes */
    .btn-placeholder {
  width: 240px;
  height: 50px;
  flex-shrink: 0;
  display: none;
}

    /* Yes button */
    .btn-yes {
  width: 240px;
  flex-shrink: 0;
  background: linear-gradient(135deg, #ff4da6 0%, #ff85c2 100%);
  color: #fff;
  box-shadow: 0 4px 18px rgba(255, 77, 166, 0.45);
}
    .btn-yes:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 8px 28px rgba(255, 77, 166, 0.55);
    }
    .btn-yes:active { transform: scale(0.97); }

    /* No button — starts inline, goes fixed on first escape */
    .btn-no {
      background: rgba(255, 200, 220, 0.7);
      color: #c2185b;
      box-shadow: 0 2px 10px rgba(255, 105, 160, 0.15);
      position: relative; /* inline by default, same flow as Yes */
      transition: none;
    }
    .btn-no.escaping {
      position: fixed; /* switched by JS on first hover */
    }

    /* ── Sparkle burst on Yes ── */
    .sparkle {
      position: fixed;
      pointer-events: none;
      font-size: 1.6rem;
      z-index: 999;
      animation: sparkleOut 0.9s ease-out forwards;
    }
    @keyframes sparkleOut {
      0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.5) translateY(-60px); opacity: 0; }
    }

    /* ── Hint text ── */
    .hint {
      margin-top: 22px;
      font-size: 0.75rem;
      color: #e8a0b8;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- Floating hearts background -->
  <div class="hearts-bg" id="heartsBg"></div>

  <!-- Main card -->
  <div class="card" id="card">
    <div class="gift-wrap" id="giftBox">🎁</div>

    <h1>Hey, Birthday Girl! 🎀</h1>
    <p class="subtitle">Someone made something special just for you…</p>
    <p class="question">Do you want to open your surprise? 👀</p>

    <div class="btn-row">
      <button class="btn btn-yes" id="btnYes" onclick="onYes()">Yes! Open it 💝</button>
      <button class="btn btn-no"  id="btnNo">No</button>
      <div class="btn-placeholder" id="noPlaceholder"></div>
    </div>
  </div>

<script>
  /* ═══════════════════════════════════
     1. Floating hearts background
  ═══════════════════════════════════ */
  const HEARTS = ['🩷','💕','💖','💗','✨','🌸','🎀','💞'];
  const bg = document.getElementById('heartsBg');

  function spawnHeart() {
    const el = document.createElement('span');
    el.className = 'heart-particle';
    el.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (0.9 + Math.random() * 1.2) + 'rem';
    const dur = 6 + Math.random() * 7;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (Math.random() * -dur) + 's';
    bg.appendChild(el);
    setTimeout(() => el.remove(), (dur + 1) * 1000);
  }

  // Initial batch
  for (let i = 0; i < 18; i++) spawnHeart();
  setInterval(spawnHeart, 900);


  /* ═══════════════════════════════════
     2. "No" button runs away 🐒
  ═══════════════════════════════════ */
  const btnNo        = document.getElementById('btnNo');
  const noPlaceholder = document.getElementById('noPlaceholder');
  let noEscapes = 0;
  let isEscaping = false;

  function getRandomPos() {
    const bw = btnNo.offsetWidth  || 190;
    const bh = btnNo.offsetHeight || 50;
    const margin = 16;
    // Always clamped fully inside viewport
    const maxX = window.innerWidth  - bw - margin;
    const maxY = window.innerHeight - bh - margin;
    return {
      x: margin + Math.random() * Math.max(0, maxX - margin),
      y: margin + Math.random() * Math.max(0, maxY - margin),
    };
  }

  function runAway(e) {
    // First click: capture position → switch to fixed → show placeholder so Yes stays same width
    if (!isEscaping) {
      const rect = btnNo.getBoundingClientRect();
      btnNo.style.width  = rect.width  + 'px';
      btnNo.style.height = rect.height + 'px';
      btnNo.style.left   = rect.left   + 'px';
      btnNo.style.top    = rect.top    + 'px';
      btnNo.classList.add('escaping');
      noPlaceholder.style.display = 'block'; // hold the space Yes was sharing
      isEscaping = true;
    }

    noEscapes++;
    const pos = getRandomPos();
    btnNo.style.left = pos.x + 'px';
    btnNo.style.top  = pos.y + 'px';

    // Spin & wiggle
    btnNo.animate([
      { transform: 'rotate(0deg) scale(1)' },
      { transform: `rotate(${(Math.random() > 0.5 ? 1 : -1) * (30 + Math.random() * 60)}deg) scale(0.85)` },
      { transform: 'rotate(0deg) scale(1)' },
    ], { duration: 350, easing: 'ease-out' });

    // Shrink after 4 escapes
    if (noEscapes >= 4) {
      const newW = Math.max(60, 190 - noEscapes * 15);
      btnNo.style.width    = newW + 'px';
      btnNo.style.fontSize = Math.max(0.6, 1.05 - noEscapes * 0.07) + 'rem';
      btnNo.style.padding  = '8px 12px';
    }
  }

  // Run away on click and touch only
  btnNo.addEventListener('click', runAway);
  btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); runAway(e); }, { passive: false });


  /* ═══════════════════════════════════
     3. "Yes" click — sparkle burst
  ═══════════════════════════════════ */
  function onYes() {
    const rect = document.getElementById('btnYes').getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;

    const emojis = ['🎉','✨','🩷','💖','🎀','🌸','💕','🎊'];
    emojis.forEach((em, i) => {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = em;
      const angle = (i / emojis.length) * 360;
      const dist  = 60 + Math.random() * 60;
      const tx    = cx + Math.cos(angle * Math.PI / 180) * dist;
      const ty    = cy + Math.sin(angle * Math.PI / 180) * dist;
      s.style.left = tx + 'px';
      s.style.top  = ty + 'px';
      s.style.animationDelay = (i * 0.04) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    });

    // Navigate to next page after short delay
    setTimeout(() => {
      // Replace with your next page URL
      // window.location.href = 'birthday.html';
      alert('🎂 Opening your surprise… (link your next page here!)');
    }, 600);
  }
</script>
</body>
</html>
